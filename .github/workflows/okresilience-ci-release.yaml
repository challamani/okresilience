# CI: run tests in kind and create a release on success
name: okresilience-ci-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: ok-resilience
      RESOURCES_DIR: resources
      SCRIPTS_DIR: scripts
      DEMO_NS: demo
      DEMO_TCP_NS: tcp-ns
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     k8s-version:
    #     - v1.34.0
    #     - v1.33.4
    #     - v1.32.8
    #     mode:
    #     - ha
    #     - non-ha
    #     include:
    #     - k8s-version: v1.34.0
    #       kind-version: v0.30.0
    #       kind-image-sha: sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    #     - k8s-version: v1.33.4
    #       kind-version: v0.30.0
    #       kind-image-sha: sha256:25a6018e48dfcaee478f4a59af81157a437f15e6e140bf103f85a2e7cd0cbbf2
    #     - k8s-version: v1.32.8
    #       kind-version: v0.30.0
    #       kind-image-sha: sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # use a valid Go version that matches go.mod (format '1.23')

      - name: Build
        run: go build -o okresilience ./cmd/okresilience

      - name: Test
        run: go test -v ./...

      - name: Show resources path
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "Resources available at: $GITHUB_WORKSPACE/${{ env.RESOURCES_DIR }}"
      
      # - name: Configure KinD
      #   run: |
      #     cat > kind.yaml <<EOF
      #     apiVersion: kind.x-k8s.io/v1alpha4
      #     kind: Cluster
      #     nodes:
      #     - role: control-plane
      #       image: kindest/node:${{ matrix.k8s-version }}@${{ matrix.kind-image-sha }}
      #     - role: worker
      #       image: kindest/node:${{ matrix.k8s-version }}@${{ matrix.kind-image-sha }}
      #     - role: worker
      #       image: kindest/node:${{ matrix.k8s-version }}@${{ matrix.kind-image-sha }}
      #     - role: worker
      #       image: kindest/node:${{ matrix.k8s-version }}@${{ matrix.kind-image-sha }}
      #     containerdConfigPatches:
      #     - |-
      #       [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:$REGISTRY_PORT"]
      #         endpoint = ["http://$REGISTRY_NAME:$REGISTRY_PORT"]
      #     EOF
      #     # Log the generated kind.yaml for easy reference.
      #     cat kind.yaml

      - name: Create k8s Kind Cluster with Cloud Provider
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
          cloud_provider: true
          version: 'v0.30.0'
          kubectl_version: 'v1.33.4'

      # - name: Install kubectl
      #   uses: azure/setup-kubectl@v4
      #   with:
      #     version: 'latest'

      # - name: Create kind cluster
      #   run: |
      #     set -eux
      #     kind create cluster --name "${{ env.KIND_CLUSTER_NAME }}" --wait 60s
      #     kubectl cluster-info
      #     kubectl get nodes -o wide

      - name: Make resource scripts executable
        run: |
          set -eux
          # Make scripts in resources and scripts dir executable
          ls -la "${{ env.RESOURCES_DIR }}" || true
          chmod +x "${{ env.RESOURCES_DIR }}"/**/*.sh || true

          ls -la "${{ env.SCRIPTS_DIR }}" || true
          chmod +x "${{ env.SCRIPTS_DIR }}"/*.sh || true

      - name: Deploy Istio with demo addons (Prometheus)
        run: |
          set -eux
          ${{ env.SCRIPTS_DIR }}/install-istio.sh
          kubectl -n istio-system wait --for=condition=available --all deployment --timeout=120s || true
          kubectl -n istio-system get pods -o wide

      - name: Deploy demo services (httpbin) from resources
        run: |
          set -eux
          if [ -d "${{ env.RESOURCES_DIR }}/httpbin" ]; then
            bash "${{ env.SCRIPTS_DIR}}/deploy-httpbin.sh"
            kubectl -n "${{ env.DEMO_NS }}" wait --for=condition=available --all deployment --timeout=120s || true
            kubectl -n "${{ env.DEMO_NS }}" get pods -o wide
          fi

      - name: Run tests
        # This step should run the tests you maintain. It's up to your repo to provide scripts that assert expected behavior.
        run: |
          set -eux
          ./okresilience upstream5xxFailures \
          --prometheus-url=http://prometheus.local \
          --service-endpoint=http://httpbin.local/status/500 \
          --namespace=${{ env.DEMO_NS }} \
          --virtual-service=httpbin-vs \
          --num-requests=1 \
          --response-code=500 \
          --app=httpbin

      - name: Create GitHub Release (only on tagged push)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "okresilience ${{ github.ref_name }}"
          body: "Automated release for ${{ github.ref_name }} from CI run ${{ github.run_id }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/okresilience
          asset_name: okresilience-linux-amd64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI as workflow artifact (fallback)
        if: success() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: okresilience-cli
          path: ./bin/okresilience

      - name: Teardown demo resources & kind (always)
        if: always()
        run: |
          set -eux
          # If you provide a teardown script (recommended)
          if [ -x "${{ env.SCRIPTS_DIR }}/cleanup.sh" ]; then
            bash "${{ env.SCRIPTS_DIR }}/cleanup.sh"
          fi
          kind delete cluster --name "${{ env.KIND_CLUSTER_NAME }}"
          