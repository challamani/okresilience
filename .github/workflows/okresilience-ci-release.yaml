# CI: run tests in kind and create a release on success
name: okresilience-ci-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: ok-resilience
      RESOURCES_DIR: resources
      SCRIPTS_DIR: scripts
      DEMO_NS: demo
      DEMO_TCP_NS: tcp-ns
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build okresilience CLI
        run: go build -o okresilience ./cmd/okresilience

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Show resources path
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "Resources available at: $GITHUB_WORKSPACE/${{ env.RESOURCES_DIR }}"
      
      # - name: Configure KinD
      #   run: |
      #     cat > kind.yaml <<EOF
      #     apiVersion: kind.x-k8s.io/v1alpha4
      #     kind: Cluster
      #     nodes:
      #     - role: control-plane
      #       image: kindest/node:v1.33.4
      #     - role: worker
      #       image: kindest/node:v1.33.4
      #     - role: worker
      #       image: kindest/node:v1.33.4
      #     - role: worker
      #       image: kindest/node:v1.33.4
      #     EOF
      #     # Log the generated kind.yaml for easy reference.
      #     cat kind.yaml

      - name: Create k8s Kind Cluster with Cloud Provider
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
          cloud_provider: true
          version: 'v0.30.0'
          kubectl_version: 'v1.33.4'

      - name: Make resource scripts executable
        run: |
          set -eux
          # Make scripts executable
          ls -la "${{ env.SCRIPTS_DIR }}" || true
          chmod +x "${{ env.SCRIPTS_DIR }}"/*.sh || true

      - name: Download and install istioctl
        run: |
          set -eux
          curl -sL https://istio.io/downloadIstio | sh -
          ISTIO_DIR=$(find . -maxdepth 1 -type d -name "istio-*" | head -n 1)
          echo "Istio directory: $ISTIO_DIR"
          echo "$ISTIO_DIR/bin" >> $GITHUB_PATH

      - name: Verify istioctl installation
        run: istioctl --help

      - name: Deploy Istio with demo addons (Prometheus)
        run: |
          set -eux
          ${{ env.SCRIPTS_DIR }}/install-istio.sh
          kubectl -n istio-system wait --for=condition=available --all deployment --timeout=120s || true
          kubectl -n istio-system get pods -o wide

      - name: Deploy test services (httpbin and tcp-reset) from resources
        run: |
          set -eux
          if [ -d "${{ env.RESOURCES_DIR }}/httpbin" ]; then
            bash "${{ env.SCRIPTS_DIR}}/deploy-httpbin.sh"
            kubectl -n "${{ env.DEMO_NS }}" wait --for=condition=available --all deployment --timeout=120s || true
            kubectl -n "${{ env.DEMO_NS }}" get pods -o wide
          fi
          if [ -d "${{ env.RESOURCES_DIR }}/tcp-reset" ]; then
            bash "${{ env.SCRIPTS_DIR}}/deploy-tcp-reset.sh"
            kubectl -n "${{ env.DEMO_TCP_NS }}" wait --for=condition=available --all deployment --timeout=120s || true
            kubectl -n "${{ env.DEMO_TCP_NS }}" get pods -o wide
          fi

      - name: Run integration tests
        # This step should run the tests you maintain. It's up to your repo to provide scripts that assert expected behavior.
        run: |
          set -eux
          bash "${{ env.SCRIPTS_DIR }}/integration-tests.sh"

      - name: Create GitHub Release (only on tagged push)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "okresilience ${{ github.ref_name }}"
          body: "Automated release for ${{ github.ref_name }} from CI run ${{ github.run_id }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./okresilience
          asset_name: okresilience-linux-amd64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI as workflow artifact (fallback)
        if: success() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: okresilience-cli
          path: ./okresilience

      - name: Teardown demo resources & kind (always)
        if: always()
        run: |
          set -eux
          # If you provide a teardown script (recommended)
          if [ -x "${{ env.SCRIPTS_DIR }}/cleanup.sh" ]; then
            bash "${{ env.SCRIPTS_DIR }}/cleanup.sh"
          fi
          kind delete cluster --name "${{ env.KIND_CLUSTER_NAME }}"
          